name: Build BedLock IPA

# Manually triggered so you control exactly when a build (and its signing
# secrets) get used. Go to Actions tab -> Build BedLock IPA -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    env:
      APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      EXT_BUNDLE_ID: ${{ secrets.EXT_BUNDLE_ID }}
      APP_GROUP_ID: ${{ secrets.APP_GROUP_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # ----------------------------------------------------------------
      # Rewrite the placeholder bundle IDs / App Group / team so this
      # repo's project file matches YOUR Apple Developer account. These
      # come from repo secrets (Settings -> Secrets and variables ->
      # Actions) so nothing sensitive is committed to the repo itself.
      # ----------------------------------------------------------------
      - name: Configure bundle identifiers, App Group, and team
        run: |
          set -e
          PBX="BedLock.xcodeproj/project.pbxproj"

          # Bundle identifiers (extension ID first since it contains the app ID as a prefix)
          sed -i '' "s/com\.bedlock\.app\.BedLockMonitor/${EXT_BUNDLE_ID}/g" "$PBX"
          sed -i '' "s/com\.bedlock\.app/${APP_BUNDLE_ID}/g" "$PBX"

          # Development team for both targets
          sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$PBX"

          # App Group identifier used by PersistenceService + both entitlements files
          sed -i '' "s/group\.com\.bedlock\.shared/${APP_GROUP_ID}/g" \
            BedLock/Shared/PersistenceService.swift \
            BedLock/BedLock.entitlements \
            BedLockMonitor/BedLockMonitor.entitlements

      # ----------------------------------------------------------------
      # Import the distribution certificate (.p12, base64-encoded secret)
      # into a temporary keychain so xcodebuild can sign with it.
      # ----------------------------------------------------------------
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # ----------------------------------------------------------------
      # Install the two provisioning profiles (one per target). Each must
      # already exist in your Apple Developer account with the Family
      # Controls / App Groups capabilities enabled for its App ID.
      # ----------------------------------------------------------------
      - name: Install provisioning profiles
        env:
          APP_PROVISION_PROFILE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          EXT_PROVISION_PROFILE_BASE64: ${{ secrets.EXT_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo -n "$APP_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/app.mobileprovision"
          echo -n "$EXT_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/ext.mobileprovision"

      # ----------------------------------------------------------------
      # Switch both targets to manual signing so xcodebuild uses exactly
      # the certificate + profiles we just installed, rather than trying
      # (and failing, in CI) to manage signing automatically.
      # ----------------------------------------------------------------
      - name: Switch to manual signing
        run: |
          set -e
          PBX="BedLock.xcodeproj/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBX"

      - name: Read provisioning profile UUIDs
        id: profiles
        run: |
          set -e
          APP_UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          EXT_UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/ext.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "app_uuid=$APP_UUID" >> "$GITHUB_OUTPUT"
          echo "ext_uuid=$EXT_UUID" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          set -e
          xcodebuild -project BedLock.xcodeproj \
            -scheme BedLock \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/BedLock.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profiles.outputs.app_uuid }}" \
            archive

      - name: Write export options plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${{ steps.profiles.outputs.app_uuid }}</string>
              <key>${EXT_BUNDLE_ID}</key>
              <string>${{ steps.profiles.outputs.ext_uuid }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          set -e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BedLock.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedLock-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
